name: Produce Daily Market Videos (India & Global)

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (India Pre-Market)
    - cron: '30 2 * * 1-5'
    # 13:30 UTC = 07:00 PM IST (Global & US Market)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Choose Market Edition'
        required: true
        default: 'india'
        type: choice
        options:
          - india
          - global

jobs:
  build-and-broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-dejavu-core fonts-freefont-ttf

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          EDITION="${{ inputs.edition || 'india' }}"
          python main.py --edition $EDITION

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-video-${{ github.run_id }}
          path: |
            work/output/*.mp4
            *.mp4
          retention-days: 7
          

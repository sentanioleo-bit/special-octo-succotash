name: Produce Daily Market Videos (India & Global)

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (India Pre-Market)
    - cron: '30 2 * * 1-5'
    # 13:30 UTC = 07:00 PM IST (Global & US Market)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Choose Market Edition'
        required: true
        default: 'india'
        type: choice
        options:
          - india
          - global

permissions:
  contents: write

jobs:
  build-and-broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-dejavu-core fonts-freefont-ttf

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          EDITION="${{ inputs.edition || 'india' }}"
          python main.py --edition $EDITION

      - name: Publish Direct Video Download Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="video-$(date +'%Y%m%d-%H%M%S')"
          VIDEO_FILE=$(ls work/output/*.mp4 *.mp4 2>/dev/null | head -n 1)
          
          if [ -n "$VIDEO_FILE" ]; then
            cp "$VIDEO_FILE" latest_market_briefing.mp4
            gh release create "$TAG_NAME" latest_market_briefing.mp4 \
              --title "Market Briefing - $(date +'%Y-%m-%d %H:%M')" \
              --notes "Direct MP4 download for broadcast briefing video."
            
            REPO="${{ github.repository }}"
            DIRECT_URL="[https://github.com/$](https://github.com/$){REPO}/releases/download/${TAG_NAME}/latest_market_briefing.mp4"
            echo "DIRECT_URL=$DIRECT_URL" >> $GITHUB_ENV
            echo "Uploaded direct video to: $DIRECT_URL"
          else
            echo "No video file found to publish."
          fi

      - name: Send Direct Download Link to Telegram
        if: env.DIRECT_URL != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EDITION="${{ inputs.edition || 'india' }}"
          python -c "
          import os, requests
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          url = os.getenv('DIRECT_URL')
          edition = os.getenv('EDITION', 'india').upper()
          
          if token and chat_id and url:
              msg = (
                  f'🎬 <b>{edition} MARKET VIDEO READY (3 MIN BROADCAST)</b>\n\n'
                  f'✨ <b>1080x1920 Original Quality (Zero Compression)</b>\n'
                  f'⏱ <b>Exact 3:00 Duration • Synced Audio & Titles</b>\n\n'
                  f'⬇️ <a href=\"{url}\"><b>TAP HERE TO DOWNLOAD RAW MP4</b></a>\n\n'
                  f'<i>Direct CDN link. Tapping immediately starts download to your device.</i>'
              )
              requests.post(f'[https://api.telegram.org/bot](https://api.telegram.org/bot){token}/sendMessage', json={
                  'chat_id': chat_id,
                  'text': msg,
                  'parse_mode': 'HTML'
              }, timeout=20)
          "
          

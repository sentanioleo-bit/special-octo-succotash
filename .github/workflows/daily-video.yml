name: Produce Daily Market Videos (India & Global)

on:
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Choose Market Edition'
        required: true
        default: 'india'
        type: choice
        options:
          - india
          - global

permissions:
  contents: write

jobs:
  build-and-broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || (github.event.schedule == '30 13 * * 1-5' && 'global' || 'india') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core fonts-freefont-ttf
          for f in /etc/ImageMagick-*/policy.xml; do
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' "$f"
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Video Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py --edition "$EDITION"

      - name: Publish Direct Video Download Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${EDITION}-$(date -u +%Y%m%d-%H%M)"
          FILE="work/output/${EDITION}_market_3min.mp4"
          gh release create "$TAG" "$FILE" \
            --title "${EDITION^} Market Briefing $(date -u +%Y-%m-%d)" \
            --notes "Automated daily market video ($EDITION edition). Full quality, not compressed."
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${EDITION}_market_3min.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Send Direct Download Link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_URL: ${{ steps.release.outputs.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${EDITION^} market briefing is ready (full quality, no compression): ${VIDEO_URL}"
